[package]
name = "xgbooster-infer"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libloading = "0.8"

[profile.release]
lto = "thin"
